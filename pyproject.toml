[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cv-matching-data-mining"
version = "0.2.0"
description = "CV–job matching with TF-IDF, optional dense embeddings, and structured skill/experience fusion"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0.0",
  "numpy>=1.24.0",
  "scikit-learn>=1.3.0",
  "PyYAML>=6.0",
  "nltk>=3.8.0",
  "pydantic>=2.0.0",
  "pypdf>=4.0.0",
  "python-docx>=1.1.0",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=2.2.0", "torch>=2.0.0"]
dashboard = ["streamlit>=1.30.0", "matplotlib>=3.7.0"]
dev = ["pytest>=7.4.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
