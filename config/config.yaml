# =============================================================================
# Paths — processed corpora, model artifacts, outputs
# =============================================================================
paths:
  processed_cvs: data/silver/cleaned_cvs.csv
  processed_jobs: data/silver/cleaned_jobs.csv
  tfidf_model: data/gold/models/tfidf_model.pkl
  output_rankings: data/gold/rankings/candidate_scores.csv
  output_explanations: data/gold/rankings/candidate_scores_explained.csv
  top_candidates_csv: data/gold/rankings/top_candidates_by_job.csv
  evaluation_results_csv: data/gold/evaluation/evaluation_results.csv
  model_comparison_csv: data/gold/evaluation/model_comparison.csv
  score_audit_report_csv: data/gold/evaluation/score_audit_report.csv
  ground_truth: data/evaluation/ground_truth.csv

skills:
  path: config/skills.yaml

# =============================================================================
# Ingest — Bronze → Silver preference order (JSONL first, folders fallback)
# =============================================================================
ingest:
  raw_cvs_dir: data/bronze/cvs
  raw_jobs_dir: data/bronze/job_descriptions
  bronze_resumes_jsonl: data/bronze/resumes/resumes_bronze.jsonl
  bronze_jobs_jsonl: data/bronze/jobs/jobs_bronze.jsonl
  bronze_ner_annotations_jsonl: data/bronze/annotations/ner_annotations_bronze.jsonl

  # Non-empty: only these ``source`` tags enter ranking corpus (JSONL + optional corpus JSONL).
  # Include external_bronze_import sources so cloned repos feed matching, not only Vanetik CVs.
  ranking_sources:
    - vacancy_resume_matching
    - sample
    - huggingface_cv_matcher
    - dataturks_resume_ner_train
    - dataturks_resume_ner_test
    - mehyar_ner_annotated_cv
    - nlp_ner_on_resume_json_demo
    - cv_analysis_pdf_corpus

  # Extra NER sources → Silver profiling via JSONL (see cv_corpus_jsonl.path); not standalone ranking buckets.
  ner_corpus_sources:
    - dataturks_resume_ner_train
    - dataturks_resume_ner_test
    - mehyar_ner_annotated_cv
    - nlp_ner_on_resume_json_demo

  cv_corpus_jsonl:
    enabled: true
    path: data/silver/unified_resumes.jsonl
    id_field: record_id
    text_field: text
    id_prefix: corpus_
    # Single cap on JSONL corpus rows loaded for ranking augmentation (omit or null = unlimited).
    max_rows: 12000

# =============================================================================
# Silver — profiles and incremental JSONL
# =============================================================================
silver:
  unified_resumes: data/silver/unified_resumes.jsonl
  resume_profiles: data/silver/resume_profiles.jsonl
  job_profiles: data/silver/job_profiles.jsonl
  stats_path: data/silver/silver_stats.json
  write_silver_on_ingest: true
  write_unified_resumes: false

privacy:
  anonymize: true

preprocessing:
  language: en
  remove_stopwords: true
  lemmatize: true

tfidf:
  max_features: 5000
  ngram_range: [1, 2]
  min_df: 1
  max_df: 0.95
  sublinear_tf: true

embeddings:
  enabled: true
  model_name: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  batch_size: 32
  device: null

bm25:
  enabled: true

fusion:
  weights:
    tfidf: 0.35
    dense: 0.35
    skills: 0.20
    experience: 0.10

fusion_v2:
  weights:
    tfidf: 0.25
    dense: 0.25
    bm25: 0.20
    skills: 0.20
    experience: 0.10

matching:
  top_k: 10

evaluation:
  top_k_values: [1, 3, 5]

pipeline:
  write_explanations: true

experiment:
  write_manifest: true

logging:
  level: INFO
